<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flight Planner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <div class="header">
    <h1>🌍 <span>AI</span> Flight Planner</h1>
    <div class="header-right">
      <div class="header-select">
        <label for="cycleSelect">AIRAC:</label>
        <select id="cycleSelect">
          <option value="">Loading...</option>
        </select>
      </div>
      <button id="settingsBtn" class="btn btn-secondary">⚙️ LLM Settings</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Status -->
    <div id="status" class="status"></div>

    <!-- Input -->
    <div class="card">
      <div class="card-title">🗣️ Route Request</div>
      <div class="input-area">
        <textarea id="routeInput" placeholder="Describe your flight...&#10;e.g., VHHH to RJTT, high altitude airways, avoid Taiwan airspace"></textarea>
        <div class="input-row">
          <label for="kSelect">Candidates:</label>
          <select id="kSelect">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
          <button id="planBtn" class="btn btn-primary">✈️ Plan Route</button>
        </div>
      </div>
    </div>

    <!-- Parsed Intent -->
    <div id="parsedCard" class="card" style="display:none">
      <div class="card-title">📋 Parsed Intent</div>
      <div id="parsedContent" class="parsed-grid"></div>
    </div>

    <!-- Results -->
    <div id="resultsCard" class="card" style="display:none">
      <div class="card-title">🛫 Route Results</div>
      <div id="resultsContent"></div>
      <div id="warnings" class="warnings"></div>
    </div>
  </div>

  <!-- LLM Settings Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>⚙️ LLM API Settings</h2>

      <div class="form-group">
        <label>Provider</label>
        <select id="llmProvider">
          <option value="ollama">Ollama</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="custom">Custom (OpenAI-compatible)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base URL</label>
        <input type="text" id="llmBaseUrl" placeholder="http://localhost:11434/v1">
      </div>

      <div class="form-group">
        <label>Model</label>
        <input type="text" id="llmModel" placeholder="qwen3.5:9b-agent">
      </div>

      <div class="form-group">
        <label>API Key</label>
        <div class="api-key-wrapper">
          <input type="password" id="llmApiKey" placeholder="ollama">
          <button id="toggleKey" class="toggle-key">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label>Temperature</label>
        <div class="form-row">
          <input type="range" id="llmTemperature" min="0" max="1" step="0.05" value="0.3" style="flex:1">
          <span id="tempValue">0.3</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modalReset" class="btn btn-secondary">🔄 Reset Defaults</button>
        <button id="testConnBtn" class="btn btn-secondary">🧪 Test Connection</button>
        <button id="modalSave" class="btn btn-primary">💾 Save</button>
        <button id="modalClose" class="btn btn-secondary">✕ Close</button>
      </div>
    </div>
  </div>

  <script src="/js/settings.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
