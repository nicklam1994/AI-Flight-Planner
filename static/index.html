<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flight Planner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <div class="header">
    <h1 data-i18n="title-brand">🌍 <span>AI</span> 飛行計劃助手 / AI FLIGHT PLANNER</h1>
    <div class="header-right">
      <div class="header-select">
        <label for="cycleSelect" data-i18n="header-airac">AIRAC:</label>
        <select id="cycleSelect">
          <option value="">Loading...</option>
        </select>
      </div>
      <button id="settingsBtn" class="btn btn-secondary" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Status -->
    <div id="status" class="status"></div>

    <!-- Card: Route Request (no kSelect) -->
    <div class="card">
      <div class="card-title" data-i18n="card-route-request">🗣️ Route Request</div>
      <div class="input-area">
        <textarea id="routeInput" data-i18n="input-placeholder" data-i18n-attr="placeholder"
          placeholder="Describe your flight...&#10;e.g., VHHH to RJTT, high altitude airways, avoid Taiwan airspace"></textarea>
        <div class="input-row">
          <button id="planBtn" class="btn btn-primary" data-i18n="btn-plan">✈️ Plan Route</button>
        </div>
      </div>
    </div>

    <!-- Warnings -->
    <div id="warnings" class="warnings"></div>

    <!-- Card: Parsed Intent -->
    <div id="parsedCard" class="card" style="display:none">
      <div class="card-title" data-i18n="card-parsed-intent">📋 Parsed Intent</div>
      <div id="parsedContent"></div>
    </div>

    <!-- Card: Route Candidates (clickable cards) -->
    <div id="candidatesCard" class="card" style="display:none">
      <div class="card-title">🛫 Route Candidates</div>
      <div id="candidatesContent"></div>
    </div>

    <!-- Route Detail Section (after selection) -->
    <div id="routeDetailSection" style="display:none">

      <!-- Card: Airport Info (Departure + Arrival side by side) -->
      <div class="airport-grid" id="airportGrid">
        <div class="card airport-card" id="depAirportCard">
          <div id="depAirportContent"></div>
        </div>
        <div class="card airport-card" id="arrAirportCard">
          <div id="arrAirportContent"></div>
        </div>
      </div>

      <!-- Card: Route Details Table -->
      <div class="card" id="routeDetailCard">
        <div class="card-title">🗺️ Route Details</div>
        <div id="routeDetailContent"></div>
      </div>

      <!-- Card: Navigation Table -->
      <div class="card" id="navDetailCard">
        <div class="card-title">🧭 Navigation Waypoints</div>
        <div id="navDetailContent"></div>
      </div>
    </div>
  </div>

  <!-- LLM Settings Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>⚙️ Settings</h2>
      <div class="form-group">
        <label>Language</label>
        <select id="settingsLang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="form-group">
        <label>Timezone</label>
        <select id="settingsTimezone">
          <option value="UTC-12">UTC-12</option>
          <option value="UTC-11">UTC-11</option>
          <option value="UTC-10">UTC-10</option>
          <option value="UTC-9">UTC-9</option>
          <option value="UTC-8">UTC-8 (America/Los_Angeles, America/Vancouver)</option>
          <option value="UTC-7">UTC-7</option>
          <option value="UTC-6">UTC-6</option>
          <option value="UTC-5">UTC-5 (America/New_York, America/Toronto)</option>
          <option value="UTC-4">UTC-4</option>
          <option value="UTC-3">UTC-3</option>
          <option value="UTC-2">UTC-2</option>
          <option value="UTC-1">UTC-1</option>
          <option value="UTC+0">UTC+0 (Europe/London)</option>
          <option value="UTC+1">UTC+1 (Europe/Paris, Europe/Berlin)</option>
          <option value="UTC+2">UTC+2</option>
          <option value="UTC+3">UTC+3</option>
          <option value="UTC+4">UTC+4</option>
          <option value="UTC+5">UTC+5</option>
          <option value="UTC+6">UTC+6</option>
          <option value="UTC+7">UTC+7 (Asia/Bangkok, Asia/Ho_Chi_Minh)</option>
          <option value="UTC+8" selected>UTC+8 (Asia/Shanghai, Asia/Taipei, Asia/Hong_Kong)</option>
          <option value="UTC+9">UTC+9 (Asia/Tokyo, Asia/Seoul)</option>
          <option value="UTC+10">UTC+10</option>
          <option value="UTC+11">UTC+11</option>
          <option value="UTC+12">UTC+12</option>
          <option value="UTC+13">UTC+13</option>
          <option value="UTC+14">UTC+14</option>
        </select>
      </div>
            
      <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <input type="checkbox" id="settingsEval" style="width:auto;margin:0;accent-color:var(--accent)">
        <label for="settingsEval" style="margin:0;font-size:0.82rem;color:var(--text);text-transform:none;letter-spacing:0">Route Evaluator (AI) — slower but better ranking</label>
      </div>
<hr style="border-color:var(--border);margin:12px 0">
      <h3 style="font-size:0.85rem;color:var(--accent);margin-bottom:8px">LLM API</h3>
      <div class="form-group">
        <label class="llm-label">Provider</label>
        <select id="llmProvider">
          <option value="ollama">Ollama</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="nvidia">Nvidia NIM</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="form-group">
        <label class="llm-label">Base URL</label>
        <input type="text" id="llmBaseUrl" placeholder="http://localhost:11434/v1">
      </div>
      <div class="form-group">
        <label class="llm-label">API Key</label>
        <div class="api-key-wrapper">
          <input type="password" id="llmApiKey" placeholder="ollama">
          <button id="toggleKey" class="toggle-key">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label class="llm-label">Model</label>
        <div class="model-row">
          <input type="text" id="llmModel" list="llmModelList" placeholder="gemma4:e4b" style="flex:1;padding:8px 12px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font-size:0.9rem">
          <datalist id="llmModelList">
            <option value="gemma4:e4b"><option value="qwen3.6:27b"><option value="deepseek-chat"><option value="gpt-4o">
          </datalist>
          <button id="fetchModelsBtn" class="btn btn-secondary" title="Fetch">🔄</button>
        </div>
      </div>
      <div class="form-group">
        <label class="llm-label">Temperature</label>
        <div class="form-row">
          <input type="range" id="llmTemperature" min="0" max="1" step="0.05" value="0.3" style="flex:1">
          <span id="tempValue">0.3</span>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modalReset" class="btn btn-secondary">🔄 Reset</button>
        <button id="testConnBtn" class="btn btn-secondary">🧪 Test</button>
        <button id="modalSave" class="btn btn-primary">💾 Save</button>
        <button id="modalClose" class="btn btn-secondary">✕ Close</button>
      </div>
    </div>
  </div>
  <script src="/js/settings.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
