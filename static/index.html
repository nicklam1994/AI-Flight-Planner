<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flight Planner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <div class="header">
    <h1 data-i18n="title-brand">🌍 <span>AI</span> Flight Planner</h1>
    <div class="header-right">
      <div class="header-select">
        <label for="langSelect">🌐</label>
        <select id="langSelect">
          <option value="zh-CN">简体</option>
          <option value="zh-TW" selected>繁體</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="header-select">
        <label for="cycleSelect" data-i18n="header-airac">AIRAC:</label>
        <select id="cycleSelect">
          <option value="">Loading...</option>
        </select>
      </div>
      <button id="settingsBtn" class="btn btn-secondary" data-i18n="btn-settings">⚙️ LLM Settings</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Status -->
    <div id="status" class="status"></div>

    <!-- Card: Route Request -->
    <div class="card">
      <div class="card-title" data-i18n="card-route-request">🗣️ Route Request</div>
      <div class="input-area">
        <textarea id="routeInput" data-i18n="input-placeholder" data-i18n-attr="placeholder"
          placeholder="Describe your flight...&#10;e.g., VHHH to RJTT, high altitude airways, avoid Taiwan airspace"></textarea>
        <div class="input-row">
          <label for="kSelect" data-i18n="label-candidates">Candidates:</label>
          <select id="kSelect">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
          <button id="planBtn" class="btn btn-primary" data-i18n="btn-plan">✈️ Plan Route</button>
        </div>
      </div>
    </div>

    <!-- Warnings -->
    <div id="warnings" class="warnings"></div>

    <!-- Card: Parsed Intent -->
    <div id="parsedCard" class="card" style="display:none">
      <div class="card-title" data-i18n="card-parsed-intent">📋 Parsed Intent</div>
      <div id="parsedContent" class="parsed-grid"></div>
    </div>

    <!-- Card: Route Candidates (Step 2) -->
    <div id="candidatesCard" class="card" style="display:none">
      <div class="card-title" data-i18n="card-route-candidates">🛫 Route Candidates</div>
      <div id="candidatesContent"></div>
    </div>

    <!-- Card: Route Details (Step 4 — Four-Panel Grid) -->
    <div id="detailCard" class="card" style="display:none">
      <div class="card-title">📋 Route Details</div>

      <div class="four-panel">
        <!-- Panel 1: Departure -->
        <div class="panel panel-departure">
          <h3 id="departureTitle">🛫 Departure</h3>
          <div id="departureContent"></div>
        </div>

        <!-- Panel 2: Arrival -->
        <div class="panel panel-arrival">
          <h3 id="arrivalTitle">🛬 Arrival</h3>
          <div id="arrivalContent"></div>
        </div>

        <!-- Panel 3: Route String -->
        <div class="panel panel-routestr">
          <h3>🗺️ Route String</h3>
          <div id="routeContent"></div>
        </div>

        <!-- Panel 4: Navigation -->
        <div class="panel panel-navigation">
          <h3>🧭 Navigation Waypoints</h3>
          <div id="navigationContent"></div>
        </div>
      </div>
    </div>

    <!-- Card: Weather (Step 5) -->
    <div id="weatherCard" class="card" style="display:none">
      <div class="card-title">
        🌤️ <span data-i18n="card-weather">Weather</span>
        <button id="weatherRefreshBtn" class="btn btn-secondary btn-sm" data-i18n="btn-refresh" style="margin-left:10px">🔄 Refresh</button>
      </div>
      <div class="weather-grid">
        <div class="weather-col">
          <h4 id="weatherDepLabel">🛫 Departure</h4>
          <div id="weatherDepContent"></div>
        </div>
        <div class="weather-col">
          <h4 id="weatherArrLabel">🛬 Arrival</h4>
          <div id="weatherArrContent"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LLM Settings Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2 data-i18n="modal-title">⚙️ LLM API Settings</h2>

      <div class="form-group">
        <label data-i18n="label-provider">Provider</label>
        <select id="llmProvider">
          <option value="ollama" data-i18n="opt-provider-ollama">Ollama</option>
          <option value="openai" data-i18n="opt-provider-openai">OpenAI</option>
          <option value="deepseek" data-i18n="opt-provider-deepseek">DeepSeek</option>
          <option value="nvidia" data-i18n="opt-provider-nvidia">Nvidia NIM</option>
          <option value="custom" data-i18n="opt-provider-custom">Custom (OpenAI-compatible)</option>
        </select>
      </div>

      <div class="form-group">
        <label data-i18n="label-base-url">Base URL</label>
        <input type="text" id="llmBaseUrl" placeholder="http://localhost:11434/v1">
      </div>

      <div class="form-group">
        <label data-i18n="label-api-key">API Key</label>
        <div class="api-key-wrapper">
          <input type="password" id="llmApiKey" placeholder="ollama">
          <button id="toggleKey" class="toggle-key">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label data-i18n="label-model">Model</label>
        <div class="model-row">
          <input type="text" id="llmModel" list="llmModelList" placeholder="gemma4:e4b" style="flex:1;padding:8px 12px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font-size:0.9rem;">
          <datalist id="llmModelList">
            <option value="gemma4:e4b">
            <option value="qwen3.6:27b">
            <option value="qwen3.5:9b">
            <option value="qwen3.5:9b-agent">
            <option value="qwen3-coder:30b">
            <option value="deepseek-chat">
            <option value="gpt-4o">
          </datalist>
          <button id="fetchModelsBtn" class="btn btn-secondary" title="Fetch model list from API">🔄</button>
        </div>
      </div>

      <div class="form-group">
        <label data-i18n="label-temperature">Temperature</label>
        <div class="form-row">
          <input type="range" id="llmTemperature" min="0" max="1" step="0.05" value="0.3" style="flex:1">
          <span id="tempValue">0.3</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modalReset" class="btn btn-secondary" data-i18n="btn-reset-defaults">🔄 Reset Defaults</button>
        <button id="testConnBtn" class="btn btn-secondary" data-i18n="btn-test-connection">🧪 Test Connection</button>
        <button id="modalSave" class="btn btn-primary" data-i18n="btn-save">💾 Save</button>
        <button id="modalClose" class="btn btn-secondary" data-i18n="btn-close">✕ Close</button>
      </div>
    </div>
  </div>

  <script src="/js/settings.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
