<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flight Planner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <div class="header">
    <h1 data-i18n="title-brand">🌍 <span>AI</span> 飛行計劃助手（AI Flight Planner）</h1>
    <div class="header-right">
      <div class="header-select">
        <label for="langSelect">🌐</label>
        <select id="langSelect">
          <option value="zh-CN">简体</option>
          <option value="zh-TW" selected>繁體</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="header-select">
        <label for="cycleSelect" data-i18n="header-airac">AIRAC:</label>
        <select id="cycleSelect">
          <option value="">Loading...</option>
        </select>
      </div>
      <button id="settingsBtn" class="btn btn-secondary" data-i18n="btn-settings">⚙️ LLM Settings</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Status -->
    <div id="status" class="status"></div>

    <!-- Card: Route Request (no kSelect) -->
    <div class="card">
      <div class="card-title" data-i18n="card-route-request">🗣️ Route Request</div>
      <div class="input-area">
        <textarea id="routeInput" data-i18n="input-placeholder" data-i18n-attr="placeholder"
          placeholder="Describe your flight...&#10;e.g., VHHH to RJTT, high altitude airways, avoid Taiwan airspace"></textarea>
        <div class="input-row">
          <button id="planBtn" class="btn btn-primary" data-i18n="btn-plan">✈️ Plan Route</button>
        </div>
      </div>
    </div>

    <!-- Warnings -->
    <div id="warnings" class="warnings"></div>

    <!-- Card: Parsed Intent -->
    <div id="parsedCard" class="card" style="display:none">
      <div class="card-title" data-i18n="card-parsed-intent">📋 Parsed Intent</div>
      <div id="parsedContent"></div>
    </div>

    <!-- Card: Route Candidates (clickable cards) -->
    <div id="candidatesCard" class="card" style="display:none">
      <div class="card-title">🛫 Route Candidates</div>
      <div id="candidatesContent"></div>
    </div>

    <!-- Route Detail Section (after selection) -->
    <div id="routeDetailSection" style="display:none">

      <!-- Card: Airport Info (Departure + Arrival side by side) -->
      <div class="airport-grid" id="airportGrid">
        <div class="card airport-card" id="depAirportCard">
          <div id="depAirportContent"></div>
        </div>
        <div class="card airport-card" id="arrAirportCard">
          <div id="arrAirportContent"></div>
        </div>
      </div>

      <!-- Card: Route Details Table -->
      <div class="card" id="routeDetailCard">
        <div class="card-title">🗺️ Route Details</div>
        <div id="routeDetailContent"></div>
      </div>

      <!-- Card: Navigation Table -->
      <div class="card" id="navDetailCard">
        <div class="card-title">🧭 Navigation Waypoints</div>
        <div id="navDetailContent"></div>
      </div>
    </div>
  </div>

  <!-- LLM Settings Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2 data-i18n="modal-title">⚙️ LLM API Settings</h2>
      <div class="form-group">
        <label data-i18n="label-provider">Provider</label>
        <select id="llmProvider">
          <option value="ollama">Ollama</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="nvidia">Nvidia NIM</option>
          <option value="custom">Custom (OpenAI-compatible)</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="label-base-url">Base URL</label>
        <input type="text" id="llmBaseUrl" placeholder="http://localhost:11434/v1">
      </div>
      <div class="form-group">
        <label data-i18n="label-api-key">API Key</label>
        <div class="api-key-wrapper">
          <input type="password" id="llmApiKey" placeholder="ollama">
          <button id="toggleKey" class="toggle-key">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label data-i18n="label-model">Model</label>
        <div class="model-row">
          <input type="text" id="llmModel" list="llmModelList" placeholder="gemma4:e4b" style="flex:1;padding:8px 12px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font-size:0.9rem;">
          <datalist id="llmModelList">
            <option value="gemma4:e4b"><option value="qwen3.6:27b"><option value="deepseek-chat"><option value="gpt-4o">
          </datalist>
          <button id="fetchModelsBtn" class="btn btn-secondary" title="Fetch model list">🔄</button>
        </div>
      </div>
      <div class="form-group">
        <label data-i18n="label-temperature">Temperature</label>
        <div class="form-row">
          <input type="range" id="llmTemperature" min="0" max="1" step="0.05" value="0.3" style="flex:1">
          <span id="tempValue">0.3</span>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modalReset" class="btn btn-secondary">🔄 Reset</button>
        <button id="testConnBtn" class="btn btn-secondary">🧪 Test</button>
        <button id="modalSave" class="btn btn-primary">💾 Save</button>
        <button id="modalClose" class="btn btn-secondary">✕ Close</button>
      </div>
    </div>
  </div>

  <script src="/js/settings.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
